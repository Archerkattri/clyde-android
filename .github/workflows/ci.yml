name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  brain:
    name: Brain safety contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: brain/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev

  android:
    name: Android debug build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install the declared Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch verified Sherpa ONNX runtime
        run: ./scripts/fetch-sherpa-aar.sh
      - name: Build and lint the debug app
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
