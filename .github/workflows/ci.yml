name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  brain:
    name: Brain safety contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: brain/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev

  android:
    name: Android debug build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install the declared Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Report vulnerable dependency paths
        if: github.event_name == 'workflow_dispatch'
        run: |
          for configuration in debugRuntimeClasspath releaseRuntimeClasspath; do
            for dependency in io.netty org.bouncycastle:bcprov-jdk18on org.apache.commons:commons-lang3 org.apache.httpcomponents:httpclient; do
              echo "== $configuration: $dependency =="
              ./gradlew --no-daemon :app:dependencyInsight --configuration "$configuration" --dependency "$dependency"
            done
          done
          ./gradlew --no-daemon buildEnvironment :app:buildEnvironment :baselineprofile:buildEnvironment
      - name: Fetch verified Sherpa ONNX runtime
        run: ./scripts/fetch-sherpa-aar.sh
      - name: Build and lint the debug app
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
