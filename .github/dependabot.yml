version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      security:
        applies-to: "security-updates"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      security:
        applies-to: "security-updates"
  - package-ecosystem: "npm"
    directory: "/brain"
    schedule:
      interval: "weekly"
    groups:
      security:
        applies-to: "security-updates"
